<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>FX Position Size</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#111827;margin:0}.wrap{max-width:520px;margin:auto;padding:20px 16px 40px}h1{font-size:25px;margin:8px 0 4px}.sub{color:#667085;margin:0 0 20px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;color:#667085;font-weight:600;margin-bottom:6px}input,select,button{font:inherit;font-size:17px}input,select{box-sizing:border-box;width:100%;min-height:52px;border:1px solid #d0d5dd;border-radius:12px;background:white;padding:0 12px;color:#111827}.risk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.risk button{min-height:48px;border:1px solid #d0d5dd;background:#fff;border-radius:12px;font-weight:700}.risk button.on{background:#111827;color:#fff;border-color:#111827}.custom-risk{margin-top:14px}.custom-risk label{margin-bottom:6px}.risk-hint{font-size:12px;color:#667085;margin:7px 0 0}.result{text-align:center}.lots{font-size:48px;font-weight:800;letter-spacing:-2px}.muted{color:#667085;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;border-top:1px solid #eaecf0;padding-top:14px}.stat b{display:block;font-size:16px;margin-top:4px}.status{font-size:12px;color:#667085;text-align:center;margin-top:10px}.error{color:#b42318}.refresh{width:100%;min-height:48px;border:0;border-radius:12px;background:#eef2f6;color:#111827;font-weight:700;margin-top:10px}@media(max-width:360px){.grid{grid-template-columns:1fr}.lots{font-size:42px}}</style></head><body><main class="wrap"><h1>FX Position Size</h1><p class="sub">GBP account · 28 FX pairs</p><div class="card grid"><div><label>Account balance (£)</label><input id="balance" type="number" inputmode="decimal" value="100000"></div><div><label>Pair</label><select id="pair"></select></div></div><div class="card"><label>Risk per trade — quick select</label><div class="risk" id="risk"><button type="button" data-v="0.5">0.5%</button><button type="button" data-v="1" class="on">1%</button><button type="button" data-v="1.5">1.5%</button><button type="button" data-v="2">2%</button></div><div class="custom-risk"><label for="riskInput">Risk (%) — enter any amount, e.g. 0.6</label><input id="riskInput" type="number" inputmode="decimal" min="0.01" max="100" step="0.01" value="1" aria-label="Risk percentage"><p class="risk-hint">Updates position size automatically and remembers your choice.</p></div></div><div class="card"><label>Stop loss (pips)</label><input id="sl" type="number" inputmode="decimal" value="20" min="0.1" step="0.1"></div><div class="card result"><div class="muted">POSITION SIZE</div><div><span class="lots" id="lots">—</span> <b>lots</b></div><div class="stats"><div class="stat"><span class="muted">Actual risk</span><b id="money">—</b></div><div class="stat"><span class="muted">Units</span><b id="units">—</b></div><div class="stat"><span class="muted">£ / pip</span><b id="pp">—</b></div></div><button class="refresh" id="refresh">Refresh FX rate</button><div class="status" id="status">Loading FX rate…</div></div></main><script>
const pairs=['AUDCAD','AUDCHF','AUDJPY','AUDNZD','AUDUSD','CADCHF','CADJPY','CHFJPY','EURAUD','EURCAD','EURCHF','EURGBP','EURJPY','EURNZD','EURUSD','GBPAUD','GBPCAD','GBPCHF','GBPJPY','GBPNZD','GBPUSD','NZDCAD','NZDCHF','NZDJPY','NZDUSD','USDCAD','USDCHF','USDJPY'];
const pair=document.querySelector('#pair'),balance=document.querySelector('#balance'),sl=document.querySelector('#sl'),status=document.querySelector('#status'),riskInput=document.querySelector('#riskInput'); let risk=1, rate=1, rateDate='';
pairs.forEach(p=>pair.add(new Option(p,p))); pair.value=localStorage.getItem('pair')||'EURUSD'; balance.value=localStorage.getItem('balance')||'100000'; sl.value=localStorage.getItem('sl')||'20';
const savedRisk=Number(localStorage.getItem('risk'));
risk=(Number.isFinite(savedRisk)&&savedRisk>0&&savedRisk<=100)?savedRisk:1;
riskInput.value=risk;
function updateRiskButtons(){document.querySelectorAll('#risk button').forEach(b=>b.classList.toggle('on',Number(b.dataset.v)===risk));}
document.querySelectorAll('#risk button').forEach(b=>{b.onclick=()=>{risk=Number(b.dataset.v);riskInput.value=risk;localStorage.setItem('risk',String(risk));updateRiskButtons();calc();}});
riskInput.addEventListener('input',()=>{const value=Number(riskInput.value);risk=(riskInput.value.trim()!==''&&Number.isFinite(value)&&value>0&&value<=100)?value:NaN;if(Number.isFinite(risk))localStorage.setItem('risk',String(risk));updateRiskButtons();calc();});
updateRiskButtons();
function quote(){return pair.value.slice(3)}
async function getRate(){const q=quote(); if(q==='GBP'){rate=1;rateDate='GBP quote';status.textContent='No conversion needed — pair is quoted in GBP.';calc();return} status.className='status';status.textContent='Updating '+q+' → GBP rate…';try{const r=await fetch('https://api.frankfurter.dev/v2/rate/'+q.toLowerCase()+'/gbp');if(!r.ok)throw new Error('rate');const d=await r.json();rate=+d.rate;rateDate=d.date||'latest';localStorage.setItem('rate_'+q,JSON.stringify({rate,date:rateDate}));status.textContent=q+' → GBP '+rate.toFixed(6)+' · '+rateDate;calc()}catch(e){const c=JSON.parse(localStorage.getItem('rate_'+q)||'null');if(c){rate=c.rate;rateDate=c.date;status.textContent='Offline — using saved '+q+' → GBP rate from '+c.date;calc()}else{status.className='status error';status.textContent='Could not load FX rate. Connect to the internet and tap Refresh.';rate=0;calc()}}}
function calc(){const b=+balance.value,s=+sl.value;if(!(b>0&&s>0&&rate>0&&Number.isFinite(risk)&&risk>0&&risk<=100)){['lots','money','units','pp'].forEach(id=>document.getElementById(id).textContent='—');return}const pip=quote()==='JPY'?.01:.0001,pipLot=pip*100000*rate,target=b*risk/100,lotsRaw=target/(s*pipLot),lots=Math.floor((lotsRaw+1e-10)*100)/100,perPip=lots*pipLot,actual=perPip*s;document.querySelector('#lots').textContent=lots.toFixed(2);document.querySelector('#money').textContent='£'+actual.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});document.querySelector('#units').textContent=Math.round(lots*100000).toLocaleString('en-GB');document.querySelector('#pp').textContent='£'+perPip.toFixed(2)}
[balance,sl].forEach(e=>e.addEventListener('input',()=>{localStorage.setItem(e.id,e.value);calc()}));pair.onchange=()=>{localStorage.setItem('pair',pair.value);getRate()};document.querySelector('#refresh').onclick=getRate;if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});getRate();
</script></body></html>
